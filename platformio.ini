; DOSAPALM V1 — firmware v8 (ESP32-WROVER + L86)
; Usa el core Arduino-ESP32 3.x (mismo que el Arduino IDE del v7), por eso la
; plataforma es pioarduino: la espressif32 oficial de PlatformIO quedó en core 2.x.
;
;   pio run              -> compila
;   pio run -t upload    -> flashea
;   pio device monitor   -> serial 115200

[env:esp32wrover]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; Escribir comandos cómodo en `device monitor`: se ve lo que tecleas (echo) y
; la línea se envía solo al presionar Enter (como espera el firmware).
monitor_echo = yes
monitor_filters = send_on_enter
monitor_eol = LF
; Mismo esquema del v7 ("Huge APP 3MB No OTA / 1MB SPIFFS"): BLE+WiFi no caben en
; el esquema por defecto con OTA. El OTA real requiere decidir P2 de la solicitud.
board_build.partitions = huge_app.csv
; LittleFS para la persistencia de eventos (P0-1)
board_build.filesystem = littlefs
lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
    links2004/WebSockets@^2.6.1
